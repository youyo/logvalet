[tools]
go = "1.26.1"

[tasks.build]
description = "Build logvalet binary"
run = "go build -o logvalet ./cmd/logvalet/"

[tasks.test]
description = "Run all tests"
run = "go test ./..."

[tasks."test:integration"]
description = "Run integration-tagged tests"
run = "go test -tags=integration ./... -v"

[tasks.vet]
description = "Run go vet"
run = "go vet ./..."

[tasks.lint]
description = "Run vet and test"
run = ["mise run vet", "mise run test"]

[tasks.clean]
description = "Remove build artifacts"
run = "rm -f logvalet"

[tasks."mcp:start"]
description = "Start MCP server (local, no auth)"
run = "go run ./cmd/logvalet/ mcp-stdio"

[tasks."mcp:start-auth"]
description = "Start MCP server over Streamable HTTP with API key auth (requires LOGVALET_MCP_API_KEY, 32+ chars)"
run = "go run ./cmd/logvalet/ mcp --auth-mode=apikey"
[tasks."mcp:start-auth".env]
LOGVALET_SPACE_STORE_TYPE = "sqlite"

[tasks."docker:build"]
description = "Build Docker image"
run = "docker build -t logvalet ."

[tasks."docker:run"]
description = "Run Docker container (requires env vars)"
run = "docker run -p 8080:8080 logvalet"
